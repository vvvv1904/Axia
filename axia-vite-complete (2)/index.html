    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "What is Axia?", "acceptedAnswer": { "@type": "Answer", "text": "Axia is an all-in-one business platform that combines CRM, billing, time tracking, and a Truth Layer verification engine. It replaces the five tools freelancers and agencies duct-tape together — one tab, zero chaos." } },
        { "@type": "Question", "name": "Who is Axia built for?", "acceptedAnswer": { "@type": "Answer", "text": "Axia is built for freelancers and agencies — writers, developers, designers, consultants, coaches, photographers, videographers, bookkeepers, marketing agencies, creative agencies, staffing agencies, PR agencies, and digital agencies." } },
        { "@type": "Question", "name": "How does the Truth Layer verification work?", "acceptedAnswer": { "@type": "Answer", "text": "The Truth Layer is a background engine that validates your activity in real-time. It provides indisputable proof of what was done, when, and for how long — so every billable hour is documented and disputes become a thing of the past." } },
        { "@type": "Question", "name": "How much does Axia cost?", "acceptedAnswer": { "@type": "Answer", "text": "Axia has four plans: Free ($0/mo), Starter ($7/mo), Pro ($15/mo), and Expert ($49/mo). Founding members get 50% off any tier for one year. Every plan includes the Truth Layer verification engine." } },
        { "@type": "Question", "name": "What is scope creep protection?", "acceptedAnswer": { "@type": "Answer", "text": "Scope creep protection automatically detects when project work expands beyond the original agreement and creates one-click change orders. This ensures every hour is accounted for and billable — so you never do unpaid work again." } },
        { "@type": "Question", "name": "How does the referral program work?", "acceptedAnswer": { "@type": "Answer", "text": "When you join the Axia waitlist, you get a unique referral link. Refer 1 friend for priority early access, 3 friends for 3 months free on Starter, 5 friends for 50% off any tier for one year, or 10 friends for Expert tier free for 1 year." } }
      ]
    }
